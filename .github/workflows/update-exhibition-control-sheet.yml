name: Update exhibition control sheet

on:
  push:
    paths:
      - 'Result/Exhibition Organizers/completion_manifest.json'
      - 'scripts/update_control_sheet.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-control-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Sheets client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Mark validated artifacts done
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          COMPLETION_MANIFEST: Result/Exhibition Organizers/completion_manifest.json
        run: python scripts/update_control_sheet.py
